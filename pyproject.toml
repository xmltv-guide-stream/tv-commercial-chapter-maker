[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chaptermaker"
version = "0.1.2"
description = "Adaptively insert chapter markers at likely commercial breaks in video files (built for messy VHS/DVR rips)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
***REMOVED***
keywords = ["video", "chapters", "mkv", "ffmpeg", "commercial-detection", "vhs", "dvr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]

[project.scripts]
chaptermark = "chaptermaker.cli:main"

[tool.setuptools]
packages = ["chaptermaker"]
